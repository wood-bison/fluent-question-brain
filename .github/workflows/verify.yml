name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: true
      - run: test -z "$(gofmt -l ./cmd ./internal)"
      - run: go test ./...

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check-contract.sh
      - run: bash -n scripts/*.sh
      - run: docker compose -f deploy/compose/compose.yaml config --quiet

  cms:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/cms
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: apps/cms/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
