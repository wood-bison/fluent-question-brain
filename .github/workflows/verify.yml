name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: true
      - run: test -z "$(gofmt -l ./cmd ./internal)"
      - run: go test ./...
      - run: go vet ./...

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check-contract.sh
      - run: bash -n scripts/*.sh
      - run: docker compose -f deploy/compose/compose.yaml config --quiet
      - name: Start isolated Postgres for backup/restore smoke
        run: docker compose -p fluent-question-brain -f deploy/compose/compose.yaml up -d --build postgres
      - name: Wait for Postgres health
        run: |
          for attempt in $(seq 1 30); do
            if docker compose -p fluent-question-brain -f deploy/compose/compose.yaml ps --format json | grep -q '"Health":"healthy"'; then
              exit 0
            fi
            sleep 2
          done
          docker compose -p fluent-question-brain -f deploy/compose/compose.yaml ps
          exit 1
      - name: Run backup/restore smoke
        run: bash scripts/backup-restore-smoke.sh
      - name: Stop isolated Postgres (preserve volumes)
        if: always()
        run: docker compose -p fluent-question-brain -f deploy/compose/compose.yaml down

  cms:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/cms
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: apps/cms/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
