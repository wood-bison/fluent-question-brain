name: fluent-question-brain

x-json-logging: &json-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg18
    environment:
      POSTGRES_DB: question_brain
      POSTGRES_USER: question_brain
      POSTGRES_PASSWORD: question_brain
    ports:
      # Keep host bindings loopback-only and reserved for this stack. Internal
      # service-to-service traffic still uses the standard container port.
      - "127.0.0.1:${QB_PG_PORT:-55437}:5432"
    logging: *json-logging
    volumes:
      # PostgreSQL 18 uses a major-version subdirectory under this mount.
      # Mounting /var/lib/postgresql keeps upgrades and pg_upgrade safe.
      - question-brain-postgres:/var/lib/postgresql
      - ../../db/migrations/0001_question_brain.sql:/docker-entrypoint-initdb.d/001_question_brain.sql:ro
      - ../../db/migrations/0002_ingestion_runs.sql:/docker-entrypoint-initdb.d/002_ingestion_runs.sql:ro
      - ../../db/migrations/0003_retrieval_profile.sql:/docker-entrypoint-initdb.d/003_retrieval_profile.sql:ro
      - ../../db/migrations/0004_retrieval_indexes.sql:/docker-entrypoint-initdb.d/004_retrieval_indexes.sql:ro
      - ../../db/migrations/0005_cms_schema.sql:/docker-entrypoint-initdb.d/005_cms_schema.sql:ro
      - ../../db/migrations/0006_content_kind.sql:/docker-entrypoint-initdb.d/006_content_kind.sql:ro
      - ../../db/migrations/0007_canonical_identity.sql:/docker-entrypoint-initdb.d/007_canonical_identity.sql:ro
      - ../../db/migrations/0009_semantic_v1_profile.sql:/docker-entrypoint-initdb.d/009_semantic_v1_profile.sql:ro
      - ../../db/migrations/0010_level_company_dimensions.sql:/docker-entrypoint-initdb.d/010_level_company_dimensions.sql:ro
      - ../../db/migrations/0011_path_domain_capability_taxonomy.sql:/docker-entrypoint-initdb.d/011_path_domain_capability_taxonomy.sql:ro
      - ../../db/migrations/0012_curriculum_mapping_release.sql:/docker-entrypoint-initdb.d/012_curriculum_mapping_release.sql:ro
      - ../../db/migrations/0013_runtime_station_capabilities.sql:/docker-entrypoint-initdb.d/013_runtime_station_capabilities.sql:ro
      - ../../db/migrations/0014_python_path.sql:/docker-entrypoint-initdb.d/014_python_path.sql:ro
      - ../../db/migrations/0015_capability_registry_v2.sql:/docker-entrypoint-initdb.d/015_capability_registry_v2.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U question_brain -d question_brain"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile.api
    environment:
      APP_ENV: ${APP_ENV:-local}
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://question_brain:question_brain@postgres:5432/question_brain?sslmode=disable
      EMBEDDING_PROFILE: ${EMBEDDING_PROFILE:-semantic-v1}
      EMBEDDING_PROVIDER_ENDPOINT: ${EMBEDDING_PROVIDER_ENDPOINT:-http://host.docker.internal:11434}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-bge-m3}
      SEARCH_MIN_RANK_SCORE: ${SEARCH_MIN_RANK_SCORE:-0.02}
      SEARCH_MIN_SEMANTIC_SCORE: ${SEARCH_MIN_SEMANTIC_SCORE:-0.505}
      OTEL_EXPORTER_OTLP_ENDPOINT: jaeger:4317
      QUESTION_BRAIN_INTERNAL_TOKEN: ${QUESTION_BRAIN_INTERNAL_TOKEN:-local-promote-token}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${QB_HTTP_PORT:-48127}:8080"
    volumes:
      - ../../releases/curriculum-mapping-2026-08-24-runtime-crosswalk.json:/opt/releases/curriculum-mapping-2026-08-24-runtime-crosswalk.json:ro
      - ../../releases/curriculum-mapping-2026-08-24-editorial-approved.json:/opt/releases/curriculum-mapping-2026-08-24-editorial-approved.json:ro
    logging: *json-logging
    depends_on:
      postgres:
        condition: service_healthy
      jaeger:
        condition: service_started
    healthcheck:
      test: ["CMD", "/question-brain", "--healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  indexer:
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile.indexer
    environment:
      DATABASE_URL: postgres://question_brain:question_brain@postgres:5432/question_brain?sslmode=disable
      EMBEDDING_PROVIDER_ENDPOINT: ${EMBEDDING_PROVIDER_ENDPOINT:-http://host.docker.internal:11434}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-bge-m3}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging: *json-logging
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/qb-index", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  cms:
    build:
      context: ../../apps/cms
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:-local-only-change-me}
      PAYLOAD_DATABASE_URL: postgres://question_brain:question_brain@postgres:5432/question_brain?sslmode=disable
      QUESTION_BRAIN_PROMOTE_URL: http://api:8080/v1/promote
      QUESTION_BRAIN_INTERNAL_TOKEN: ${QUESTION_BRAIN_INTERNAL_TOKEN:-local-promote-token}
      # Loopback-only stack: sign the admin in automatically so browsing the
      # bank does not start with a password prompt. Set QB_CMS_DEV_LOGIN=0 to
      # get the normal login form back.
      QB_CMS_DEV_LOGIN: ${QB_CMS_DEV_LOGIN:-1}
      QB_CMS_DEV_EMAIL: ${QB_CMS_DEV_EMAIL:-dev@local.dev}
      QB_CMS_DEV_PASSWORD: ${QB_CMS_DEV_PASSWORD:-local-dev-password}
    ports:
      - "127.0.0.1:${QB_CMS_PORT:-48128}:3000"
    logging: *json-logging
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/admin').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  jaeger:
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.20.0
    ports:
      # Jaeger all-in-one is local-only; the API uses jaeger:4317 internally.
      - "127.0.0.1:${QB_JAEGER_UI_PORT:-56686}:16686"
      - "127.0.0.1:${QB_OTLP_GRPC_PORT:-54317}:4317"
      - "127.0.0.1:${QB_OTLP_HTTP_PORT:-54318}:4318"
    logging: *json-logging
    restart: unless-stopped

volumes:
  question-brain-postgres:
    name: fluent-question-brain-postgres
